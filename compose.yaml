# Plain Compose spec only. No Docker-only extensions, so this file runs
# unchanged under Podman (dev) and Docker (self-hosters).
#
# Two ways to run it:
#
#   npm run db:up                                  # the database alone, for dev
#   docker compose --profile serve up -d --build   # the whole application
#
# TLS is a third file, `deploy/compose.proxy.yaml`, layered on top of this one.
# It is separate rather than a profile because Compose interpolates every service
# in a file whichever profile is active, so a required APP_DOMAIN in here would
# make `npm run db:up` demand a public hostname on a laptop.

# Docker keeps container logs forever by default, and on the smallest VPS the
# thing that fills the disk first is a year of them. Every service caps them.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: docker.io/library/postgres:18-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cooking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cooking}
      POSTGRES_DB: ${POSTGRES_DB:-cooking}
      # Checksums detect a page corrupted underneath Postgres, on a disk this
      # project does not choose. They can only be turned on at initdb time, so
      # the choice is made here or never: enabling it later means dumping and
      # reloading the cluster.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      # Loopback only. On a VPS, publishing 5432 on every interface puts the
      # database on the public internet, and nothing outside this machine needs
      # it: the application reaches it over the compose network, and a backup
      # runs through `docker compose exec`.
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18+ images place data in a major-version subdirectory, so the
      # mount goes one level up. Mounting /var/lib/postgresql/data fails to boot.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cooking} -d ${POSTGRES_DB:-cooking}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Runs once per deploy and exits. Creates the least-privileged runtime role,
  # migrates the domain tables, then lets Better Auth migrate its own twelve.
  migrate:
    profiles: ["serve"]
    build:
      context: .
      target: migrator
    logging: *logging
    environment: &db_env
      DATABASE_URL: postgres://${POSTGRES_USER:-cooking}:${POSTGRES_PASSWORD:-cooking}@db:5432/${POSTGRES_DB:-cooking}
      APP_DATABASE_URL: postgres://cooking_app:${APP_DB_PASSWORD:-cooking_app}@db:5432/${POSTGRES_DB:-cooking}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    profiles: ["serve"]
    build:
      context: .
      target: runtime
    restart: unless-stopped
    logging: *logging
    # Compose injects only what this block lists. A value sitting in .env is
    # available for interpolation on the right-hand side, but it does not reach
    # the process unless it is named here, so every variable the application
    # reads at runtime has to appear below.
    environment:
      <<: *db_env
      # No defaults on purpose. A deployment that silently came up with a
      # placeholder secret, or with localhost as its OAuth issuer, is worse than
      # one that refuses to start: see docs/08-self-hosting.md section 3.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?generate one with openssl rand -base64 32}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?the public https origin, not localhost}
      MCP_RESOURCE: ${MCP_RESOURCE:?the public https origin plus /api/mcp}
      # Required for the same reason. The Google pair is the only sign-in method
      # this profile offers, because AUTH_PASSWORD_LOGIN is deliberately absent
      # from this block: the password endpoints exist for `npm run verify:oauth`
      # and a container facing the internet has no business opening them.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?the Google OAuth client id, or there is no way to sign in}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?the matching secret}
      # Empty is closed in production, so an instance without this starts fine
      # and then lets nobody in, including you. Refusing at `up` is the louder
      # failure and the message carries the fix.
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:?comma separated addresses allowed to hold an account}
    ports:
      # Loopback only: TLS is terminated by the reverse proxy in front, whether
      # that is deploy/compose.proxy.yaml or something already on the machine.
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # /api/health runs `select 1` on the runtime pool, so an application that
      # is listening but cannot reach Postgres reports unhealthy instead of
      # serving an error on every screen. wget is busybox's, present in Alpine.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  pgdata:
