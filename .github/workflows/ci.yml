name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run of this workflow per ref at a time, and never cancelled.
#
# Cancelling is the wrong default here because of the publish job. Two pushes to
# main land minutes apart, both build, and nothing orders them: the older commit
# can finish last and overwrite `main-runtime` with older code, while its own
# summary reports success and the newer run's does too. Serialising the ref
# makes the last push the last image. `cancel-in-progress: false` rather than
# true for the same reason: a cancelled publish can have pushed one of its two
# tags already.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# The floor for every job. GITHUB_TOKEN otherwise carries whatever the
# repository default is, which is write access to everything on a repository
# that has never been narrowed. Only `publish` needs more, and it asks for
# exactly what it needs and nothing else.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Nothing here takes five minutes. Without a limit the default is six hours,
    # which is what a hung Postgres service container or a watch-mode test would
    # spend before anyone noticed.
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: cooking
          POSTGRES_PASSWORD: cooking
          POSTGRES_DB: cooking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cooking -d cooking"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://cooking:cooking@localhost:5432/cooking
      APP_DATABASE_URL: postgres://cooking_app:cooking_app@localhost:5432/cooking
      BETTER_AUTH_SECRET: ci-secret-not-used-in-production
      BETTER_AUTH_URL: http://localhost:3000
      MCP_RESOURCE: http://localhost:3000/api/mcp
      # CI has no Google OAuth client, and the application refuses to boot with
      # no way in at all. The password door is that way in here.
      AUTH_PASSWORD_LOGIN: "true"

    steps:
      # Third-party actions are pinned by commit, not by tag. A tag is a moving
      # pointer that the action's own maintainer can repoint, so `@v5` is a
      # standing grant of arbitrary code execution in a job that holds a token.
      # The version is in the comment because a digest tells a human nothing;
      # refresh both together with
      # `gh api repos/<owner>/<repo>/commits/<tag> --jq .sha`.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Constraint 1 from CLAUDE.md. Fails the build if any LLM client reaches
      # the lockfile, or if any file in src/ names a model provider's host,
      # which is what calling one without a dependency looks like.
      - name: No LLM dependency
        run: npm run check:deps

      - run: npm run db:bootstrap
      - run: npm run db:migrate
      - run: npm run auth:migrate

      # Tests run against their own database, created here. Its URLs are derived
      # from the two above, so nothing extra goes in the env block.
      - run: npm run db:setup:test

      # The same order as `npm run verify`, so a green CI and a green laptop
      # mean the same thing.
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Its own step, because a shell script is the one thing in this repository
      # that no other check reads. `set -eu` without pipefail, an unquoted
      # expansion, a `find` whose failure is swallowed by the loop reading it:
      # all three shipped in scripts/backup.sh at one time or another, and all
      # three are what this catches. shellcheck is preinstalled on the runner.
      - name: The backup script
        run: shellcheck scripts/backup.sh

  # The container path, end to end, because none of it can fail on a laptop
  # running `npm run dev` and all of it fails on a server. Three defects shipped
  # at once for exactly that reason: the image had never been built, the
  # migrator was missing the environment the auth module reads at import, and
  # the application was never handed the Google credentials or the allowlist.
  #
  # tests/deploy.test.ts pins down what the files say. This job is what proves
  # the stack actually comes up and answers.
  deploy:
    runs-on: ubuntu-latest
    # A build plus an `up --wait` plus six curls. The limit is here for the
    # `--wait`, which blocks on a healthcheck and has no timeout of its own.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Compose reads .env, so the values go in a file rather than the env
      # block. None of them is a real credential: nothing here reaches Google,
      # and the instance is destroyed at the end of the job.
      - name: Configuration
        run: |
          cat > .env <<'ENV'
          POSTGRES_PASSWORD=ci-postgres
          APP_DB_PASSWORD=ci-app
          BETTER_AUTH_SECRET=Y2ktc2VjcmV0LW5vdC11c2VkLWluLXByb2R1Y3Rpb24=
          BETTER_AUTH_URL=http://localhost:3000
          MCP_RESOURCE=http://localhost:3000/api/mcp
          GOOGLE_CLIENT_ID=ci-client-id
          GOOGLE_CLIENT_SECRET=ci-client-secret
          ALLOWED_EMAILS=ci@example.test
          ENV

      # The reverse proxy is the only public-facing service in a real
      # deployment, and its configuration is a file this repository ships. A
      # syntax error in it is currently found on the VPS, after a `git pull`,
      # with the proxy restart-looping and the site down. Caddy validates its
      # own config, so it can be found here instead.
      #
      # Both variables are supplied because the file interpolates them and an
      # empty site address is itself a parse error, which would make this step
      # fail for a reason that has nothing to do with the change under test.
      - name: The Caddyfile parses
        run: |
          docker run --rm \
            -e APP_DOMAIN=ci.example.test \
            -e ACME_EMAIL=ci@example.test \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            docker.io/library/caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile

      # --wait blocks until the database reports healthy, the migrator exits
      # zero and the application's own healthcheck passes, so a failure here is
      # a failure of the deployment and not of the curl below.
      - name: Build and start the stack
        run: docker compose --profile serve up -d --build --wait

      # /api/health runs `select 1` on the runtime pool, so this passing means
      # the least-privileged role the migrator created is the one the
      # application connects with.
      - name: It is up, and it can reach Postgres
        run: |
          test "$(curl -fsS http://localhost:3000/api/health)" = '{"status":"ok"}'

      # The two rewrites in next.config.ts are the whole paste-one-URL
      # connection story. A client that cannot find the authorization server
      # cannot connect at all, and nothing else in CI exercises them.
      - name: An MCP client can discover the authorization server
        run: |
          curl -fsS http://localhost:3000/.well-known/oauth-authorization-server/api/auth \
            | grep -q '"authorization_endpoint"'
          curl -fsS http://localhost:3000/.well-known/oauth-protected-resource/api/mcp \
            | grep -q '"resource":"http://localhost:3000/api/mcp"'

      # The RFC 9728 challenge is what points a cold client at that metadata.
      - name: An unauthenticated MCP call is refused, with the way in
        run: |
          curl -si -X POST http://localhost:3000/api/mcp \
            -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
            | tee /tmp/mcp.txt | grep -q '^HTTP/1.1 401'
          grep -qi 'www-authenticate: Bearer resource_metadata=' /tmp/mcp.txt

      # AUTH_PASSWORD_LOGIN is not passed to the container, whatever .env says.
      # The endpoints answer and refuse rather than not existing, so the code is
      # what is asserted.
      - name: The password door is closed in the container
        run: |
          curl -sS -X POST http://localhost:3000/api/auth/sign-in/email \
            -H 'content-type: application/json' \
            -d '{"email":"ci@example.test","password":"long-enough-to-pass-validation"}' \
            | grep -q 'EMAIL_PASSWORD_DISABLED'

      - name: Logs, if any of that failed
        if: failure()
        run: docker compose --profile serve logs --no-color --tail 200

      - name: Down
        if: always()
        run: docker compose --profile serve down -v

  # What the server actually runs. The build happens here rather than on the VPS
  # for two reasons: `next build` wants more CPU and memory than the smallest
  # instance has, and the image must be amd64 while the machine this is developed
  # on is arm64.
  #
  # Only on a push to main, and only behind both jobs above, so nothing reaches
  # the registry that has not built, come up, and answered.
  publish:
    needs: [verify, deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Two amd64 images, cross-built, with a cold cache on the first run of a day.
    timeout-minutes: 30

    permissions:
      contents: read
      # GITHUB_TOKEN can push to this repository's own packages, so publishing
      # needs no personal token. Pulling on the server does, because the package
      # is private: see docs/08-self-hosting.md.
      packages: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # GHCR rejects an uppercase path, and both github.repository and
      # github.repository_owner carry the account's real capitalisation.
      - name: Image name
        id: image
        run: |
          echo "repo=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two targets of the one Dockerfile, so two tags of the one package rather
      # than two packages: a single registry repository is a single login and a
      # single visibility setting to get wrong.
      #
      # Each gets a moving `main-*` tag, which is what compose.yaml defaults to,
      # and an immutable `sha-<commit>-*` one, which is what a rollback names.
      - name: Runtime image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.repo }}:main-runtime
            ${{ steps.image.outputs.repo }}:${{ steps.image.outputs.sha }}-runtime
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Migrator image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: migrator
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.repo }}:main-migrator
            ${{ steps.image.outputs.repo }}:${{ steps.image.outputs.sha }}-migrator
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: What to deploy
        run: |
          echo "Pushed ${{ steps.image.outputs.sha }}. On the server:" >> "$GITHUB_STEP_SUMMARY"
          echo '```sh' >> "$GITHUB_STEP_SUMMARY"
          echo 'cd ~/cooking-app && git pull' >> "$GITHUB_STEP_SUMMARY"
          echo 'docker compose --profile serve pull' >> "$GITHUB_STEP_SUMMARY"
          echo 'docker compose --profile serve up -d --no-build --wait' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
