# Credentials as mounted files instead of container environment. Layered on top
# of compose.yaml, never used alone:
#
#   docker compose -f compose.yaml -f deploy/compose.secrets.yaml \
#     --profile serve up -d --no-build --wait
#
# Set COMPOSE_FILE in .env to stop typing them every time. With TLS as well:
#
#   COMPOSE_FILE=compose.yaml:deploy/compose.proxy.yaml:deploy/compose.secrets.yaml
#
# ---------------------------------------------------------------------------
# What this buys
# ---------------------------------------------------------------------------
#
# A value in a service's `environment:` block is readable by anyone who can run
# `docker inspect`, by every process in the container, and by anything that
# reads /proc/1/environ. That is four credentials on this stack: the Better Auth
# signing secret, the Google client secret, and the two Postgres passwords, the
# second of which is embedded in the connection URLs.
#
# A Compose secret is a file mounted at /run/secrets/<name>, root-owned and
# read-only, and it appears in no environment. Both halves of the stack already
# know how to read one:
#
# - the Postgres image supports `POSTGRES_PASSWORD_FILE` natively;
# - `secret()` in src/lib/config.ts reads `<NAME>_FILE` in preference to
#   `<NAME>`, so DATABASE_URL, APP_DATABASE_URL, BETTER_AUTH_SECRET and
#   GOOGLE_CLIENT_SECRET all take the file form.
#
# ---------------------------------------------------------------------------
# Why it is a separate file, and not simply how compose.yaml works
# ---------------------------------------------------------------------------
#
# Backwards compatibility, in the only way Compose allows. It validates every
# secret a service uses whichever profile is active, and fails the whole command
# when the file is missing. Putting these in compose.yaml would therefore make
# `npm run db:up` on a laptop demand four files that a laptop has no use for,
# and would break every existing deployment that keeps its values in .env. The
# same reasoning splits deploy/compose.proxy.yaml out.
#
# Nothing here has a default. The paths are host paths, chosen by whoever runs
# the machine, and a default under the checkout would be an invitation to commit
# a secret.
#
# ---------------------------------------------------------------------------
# Setting it up
# ---------------------------------------------------------------------------
#
#   sudo install -d -m 0700 /etc/cooking-app
#   umask 077
#   openssl rand -base64 32 > /etc/cooking-app/better_auth_secret
#   openssl rand -hex 24    > /etc/cooking-app/postgres_password
#   printf '%s' 'the-google-secret' > /etc/cooking-app/google_client_secret
#   printf '%s' 'postgres://cooking:...@db:5432/cooking'     > /etc/cooking-app/database_url
#   printf '%s' 'postgres://cooking_app:...@db:5432/cooking' > /etc/cooking-app/app_database_url
#
# then in .env:
#
#   BETTER_AUTH_SECRET_FILE=/etc/cooking-app/better_auth_secret
#   GOOGLE_CLIENT_SECRET_FILE=/etc/cooking-app/google_client_secret
#   POSTGRES_PASSWORD_FILE=/etc/cooking-app/postgres_password
#   DATABASE_URL_FILE=/etc/cooking-app/database_url
#   APP_DATABASE_URL_FILE=/etc/cooking-app/app_database_url
#
# Each of those variables means the path on the host here, and the path inside
# the container in the service blocks below. One name, remapped, rather than two
# spellings of the same idea.
#
# The two URL files are the whole URL and not the password, on purpose. Compose
# cannot percent-encode a value when it builds a URL out of one, so a password
# containing `/`, `@`, `#`, `%` or `:` silently makes a URL that points
# somewhere else. Written by hand, once, into a file, it is encoded correctly by
# whoever knows what the password is.
#
# The plain variables are blanked rather than left alone. `secret()` prefers the
# file, so a stale value would be ignored and the point is to have it in no
# environment at all. The Postgres image is stricter still: it refuses to start
# when POSTGRES_PASSWORD and POSTGRES_PASSWORD_FILE are both non-empty.
#
# One thing this does not cover. Better Auth reads BETTER_AUTH_SECRET from the
# process environment itself, inside the library, so the file form works only
# because src/lib/auth.ts passes `secret: secret("BETTER_AUTH_SECRET")`
# explicitly. Keep that, or the file is mounted and ignored.
secrets:
  better_auth_secret:
    file: ${BETTER_AUTH_SECRET_FILE:?path on this host to a file holding the Better Auth signing secret}
  google_client_secret:
    file: ${GOOGLE_CLIENT_SECRET_FILE:?path on this host to a file holding the Google OAuth client secret}
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:?path on this host to a file holding the Postgres superuser password}
  database_url:
    file: ${DATABASE_URL_FILE:?path on this host to a file holding the owner connection URL}
  app_database_url:
    file: ${APP_DATABASE_URL_FILE:?path on this host to a file holding the runtime connection URL}

services:
  db:
    environment:
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password

  migrate:
    environment:
      DATABASE_URL: ""
      DATABASE_URL_FILE: /run/secrets/database_url
      APP_DATABASE_URL: ""
      APP_DATABASE_URL_FILE: /run/secrets/app_database_url
      BETTER_AUTH_SECRET: ""
      BETTER_AUTH_SECRET_FILE: /run/secrets/better_auth_secret
      GOOGLE_CLIENT_SECRET: ""
      GOOGLE_CLIENT_SECRET_FILE: /run/secrets/google_client_secret
    secrets:
      - database_url
      - app_database_url
      - better_auth_secret
      - google_client_secret

  app:
    environment:
      DATABASE_URL: ""
      DATABASE_URL_FILE: /run/secrets/database_url
      APP_DATABASE_URL: ""
      APP_DATABASE_URL_FILE: /run/secrets/app_database_url
      BETTER_AUTH_SECRET: ""
      BETTER_AUTH_SECRET_FILE: /run/secrets/better_auth_secret
      GOOGLE_CLIENT_SECRET: ""
      GOOGLE_CLIENT_SECRET_FILE: /run/secrets/google_client_secret
    secrets:
      - database_url
      - app_database_url
      - better_auth_secret
      - google_client_secret
